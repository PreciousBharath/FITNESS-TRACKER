<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            padding-top: 80px;
            color: #fff;
        }
        .form-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 12px;
            max-width: 800px;
            margin: auto;
        }
        label { font-weight: bold; }
        .btn-submit { background-color: #0dcaf0; border: none; }
        .btn-submit:hover { background-color: #20c997; }
        .recommendation-box {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 12px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('home') }}">FitnessSys</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('logout') }}">Logout</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container form-container mt-5">
    <h2 class="text-center mb-4">Fitness Recommendation Prediction</h2>

    <form method="POST">
        <div class="row g-3">
            <div class="col-md-4">
                <label>Sex</label>
                <select class="form-select" name="sex" required>
                    {% for val in sex_classes %}
                        <option value="{{ val }}">{{ val }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label>Age</label>
                <input type="number" class="form-control" name="age" min="1" max="120" required>
            </div>
            <div class="col-md-4">
                <label>Height (m)</label>
                <input type="number" step="0.01" class="form-control" name="height" required>
            </div>
            <div class="col-md-4">
                <label>Weight (kg)</label>
                <input type="number" step="0.1" class="form-control" name="weight" required>
            </div>
            <div class="col-md-4">
                <label>Hypertension</label>
                <select class="form-select" name="hypertension" required>
                    {% for val in hypertension_classes %}
                        <option value="{{ val }}">{{ val }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label>Diabetes</label>
                <select class="form-select" name="diabetes" required>
                    {% for val in diabetes_classes %}
                        <option value="{{ val }}">{{ val }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label>Fitness Level</label>
                <select class="form-select" name="level" required>
                    {% for val in level_classes %}
                        <option value="{{ val }}">{{ val }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label>Fitness Goal</label>
                <select class="form-select" name="fitness_goal" required>
                    {% for val in goal_classes %}
                        <option value="{{ val }}">{{ val }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label>Fitness Type</label>
                <select class="form-select" name="fitness_type" required>
                    {% for val in type_classes %}
                        <option value="{{ val }}">{{ val }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label>Exercises</label>
                <select class="form-select" name="exercises" required>
                    {% for val in exercises_classes %}
                        <option value="{{ val }}">{{ val }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label>Equipment</label>
                <select class="form-select" name="equipment" required>
                    {% for val in equipment_classes %}
                        <option value="{{ val }}">{{ val }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label>Diet</label>
                <select class="form-select" name="diet" required>
                    {% for val in diet_classes %}
                        <option value="{{ val }}">{{ val }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="text-center mt-4">
            <button type="submit" class="btn btn-submit btn-lg">Predict Recommendation</button>
        </div>
    </form>

    {% if recommendation %}
    <div class="recommendation-box mt-4">
        <p><strong>Prediction Date:</strong> {{ current_date }}</p>
        <p><strong>Recommended Fitness Plan:</strong> {{ recommendation }}</p>
    </div>
    {% endif %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
